services:
  - type: web
    name: akiya-scout
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: AKIYA_ALLOW_INSECURE_SSL
        value: "false"
      - key: CACHE_TTL_SECONDS
        value: "600"